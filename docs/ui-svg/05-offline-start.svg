<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">開始離線學習</title><desc id="desc">第一次使用 · 本機優先。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-05-offline-start"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">開始離線學習</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">第一次使用 · 本機優先</text><g clip-path="url(#content-05-offline-start)"><text x="24" y="159" font-size="18" fill="#172A43" font-weight="700" text-anchor="start">三步開始離線學習</text><rect x="24" y="182" width="364" height="92" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="200" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 209) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6ZM14 3v5h5M9 12h6M9 16h6"/></g><text x="94" y="216" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">1  準備教材</text><text x="94" y="240" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">選擇 Excel / CSV、手動新增或 AI 產生</text><g transform="translate(350 212) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="288" width="364" height="92" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="306" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 315) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-5v16l-5-5H4ZM17 8q6 4 0 8"/></g><text x="94" y="322" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">2  準備語音</text><text x="94" y="346" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">檢查母語及目標語的離線語音包</text><g transform="translate(350 318) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="394" width="364" height="92" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="412" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 421) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7Z"/></g><text x="94" y="428" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">3  開始學習</text><text x="94" y="452" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">下載完成後可關閉網路、鎖屏播放</text><g transform="translate(350 424) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="528" width="364" height="48" rx="24" fill="#2867A7"/><g transform="translate(42 541) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6ZM14 3v5h5M9 12h6M9 16h6"/></g><text x="216.0" y="558" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">建立 CSV 或選擇 Excel</text><rect x="24" y="590" width="364" height="48" rx="24" fill="#E8F3FF"/><g transform="translate(42 603) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></g><text x="216.0" y="620" font-size="15" fill="#2867A7" font-weight="600" text-anchor="middle">用 AI 建立教材</text><rect x="24" y="652" width="364" height="48" rx="24" fill="#FFFFFF" stroke="#E0E7F0"/><text x="206.0" y="682" font-size="15" fill="#2867A7" font-weight="600" text-anchor="middle">先用示範教材試聽</text><text x="24" y="740" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">不使用 AI 或 Google，也可以完整離線學習。</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><rect x="24" y="807" width="54" height="30" rx="16" fill="#E8F3FF"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#2867A7" font-weight="600" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h4v8H4ZM16 12h4v8h-4Z"/></g><text x="154" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">播放器</text><g transform="translate(246 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17H5ZM8 8h8M8 12h8M8 16h5"/></g><text x="257" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">教材庫</text><g transform="translate(349 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3 3 1 1 6-3 2-1 3H9l-1-3-3-1-1-6 3-2ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></g><text x="360" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">設定</text><rect x="1