<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">連接 Google Sheets</title><desc id="desc">雲端是選用功能，本機學習不受影響。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-11-sheets-connect"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">連接 Google Sheets</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">雲端是選用功能，本機學習不受影響</text><g clip-path="url(#content-11-sheets-connect)"><text x="24" y="148" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">來源名稱</text><rect x="24" y="159" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="185" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">商務三語</text><text x="24" y="228" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">Google Sheets 原始網址</text><rect x="24" y="239" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="265" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">https://docs.google.com/…</text><rect x="24" y="310" width="364" height="48" rx="24" fill="#2867A7"/><g transform="translate(42 323) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-1-10 6 6 0 0 1 11-1 5 5