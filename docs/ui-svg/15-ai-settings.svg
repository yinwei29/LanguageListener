<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">AI API 與模型</title><desc id="desc">設定一次，之後可直接產生教材。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-15-ai-settings"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">AI API 與模型</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">設定一次，之後可直接產生教材</text><g clip-path="url(#content-15-ai-settings)"><text x="24" y="148" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">AI 供應商</text><rect x="24" y="159" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="185" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">ChatGPT / OpenAI API             ▾</text><text x="24" y="226" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">API 金鑰</text><rect x="24" y="237" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="263" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">•••• •••• •••• 8K2P</text><text x="24" y="295" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">加密儲存在此裝置，不放入備份。</text><text x="24" y="336" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">模型</text><rect x="24" y="347" width="364" height="41" rx="10" fill="#FFFFFF" st