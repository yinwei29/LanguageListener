<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">新增來源</title><desc id="desc">選一種開始方式。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-07-new-source"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">新增來源</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">選一種開始方式</text><g clip-path="url(#content-07-new-source)"><rect x="24" y="138" width="364" height="96" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="156" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 165) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></g><text x="94" y="172" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">用 AI 建立新來源</text><text x="94" y="196" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">輸入主題，審核後儲存到本機</text><g transform="translate(350 168) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="248" width="364" height="96" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="266" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 275) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6ZM14 3v5h5M9 12h6M9 16h6"/></g><text x="94" y="282" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">選擇 Excel / CSV</text><text x="94" y="306" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">從手機選取教材檔案並初始化</text><g transform="translate(350 278) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="358" width="364" height="96" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="376" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 385) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g><text x="94" y="392" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">建立空白 CSV</text><text x="94" y="416" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">先建立標準欄位，再慢慢加入教材</text><g transform="translate(350 388) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="468" width="364" height="96" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="486" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 495) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17-1 4 4-1L20 7l-4-4Z"/></g><text x="94" y="502" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">手動新增教材</text><text x="94" y="526" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">不需要網路，也不必先選檔案</text><g transform="translate(350 498) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="578" width="364" height="96" rx="16" fill="#FFFFFF" stroke="#E0E7F0"/><rect x="40" y="596" width="40" height="40" rx="12" fill="#E8F3FF"/><g transform="translate(49 605) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-1-10 6 6 0 0 1 11-1 5 5 0 0 1 0 11Z"/></g><text x="94" y="612" font-size="16" fill="#172A43" font-weight="600" text-anchor="start">連接 Google Sheets</text><text x="94" y="636" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">初始化可寫來源，或加入公開唯讀來源</text><g transform="translate(350 608) scale(0.75)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g><rect x="24" y="700" width="364" height="76" rx="14" fill="#E8F3FF"/><text x="40" y="727" font-size="14" fill="#2867A7" font-weight="600" text-anchor="start">第一次使用建議</text><text x="40" y="749" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">先建立本機教材，再按需要連接雲端。</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h4v8H4ZM16 12h4v8h-4Z"/></g><text x="154" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">播放器</text><rect x="230" y="807" width="54" height="30" rx="16" fill="#E8F3FF"/><g transform="translate(246 811) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-wid