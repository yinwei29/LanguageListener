<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">確認工作表初始化</title><desc id="desc">你的原本試算表 · 確認後才寫入。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-12-sheets-initialize"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">確認工作表初始化</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">你的原本試算表 · 確認後才寫入</text><g clip-path="url(#content-12-sheets-initialize)"><rect x="24" y="136" width="190" height="28" rx="14" fill="#E5F5EE"/><text x="119.0" y="155" font-size="12" fill="#237C66" font-weight="500" text-anchor="middle">已取得 Google 授權</text><text x="24" y="207" font-size="18" fill="#172A43" font-weight="700" text-anchor="start">檢查工作表：旅行教材</text><rect x="24" y="234" width="364" height="160" rx="16" fill="#FFFFFF"/><text x="40" y="269" font-size="14" fill="#172A43" font-weight="400" text-anchor="start">目前已有     ID、繁中、英文、印尼文</text><text x="40" y="309" font-size="14" fill="#172A43" font-weight="400" text-anchor="start">需要補上     ja-JP、ko-KR</text><text x="40" y="349" font-size="14" fill="#172A43" font-weight="400" text-anchor="start">原有教材     100 筆</text><rect x="24" y="418" width="364" height="104" rx="14" fill="#E8F3FF"/><text x="40" y="445" font-size="14" fill="#2867A7" font-weight="600" text-anchor="start">確認後只補缺少的欄位</text><text x="40" y="467" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">不新增重複來源，也不改變教材 ID。</text><text x="40" y="487" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">完成後重新預覽同步內容。</text><rect x="24" y="566" width="364" height="48" rx="24" fill="#2867A7"/><text x="206.0" y="596" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">初始化雲端缺少欄位</text><rect x="24" y="630" width="364" height="48" rx="24" fill="#FFFFFF" stroke="#E0E7F0"/><text x="206.0" y="660" font-size="15" fill="#2867A7" font-weight="600" text-anchor="middle">返回，不修改工作表</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h4v8H4ZM16 12h4v8h-4Z"/></g><text x="154" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">播放器</text><rect x="230" y="807" width="54" height="30" rx="16" fill="#E8F3FF"/><g transform="translate(246 811) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17H5ZM8 8h8M8 12h8M8 16h5"/></g><text x="257" y="859" font-size="12" fill="#2867A7" font-weight="600" text-anchor="middle">教材庫</text><g transform="translate(349 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3 3 1 1 6-3 2-1 3H9l-1-3-3-1-1-6 3-2ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></g><text x="360" y="859" font-size="12" fill="#5C6E84" f