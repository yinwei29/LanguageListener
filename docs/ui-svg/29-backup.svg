<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">備份與換機</title><desc id="desc">在設定中保存教材與學習紀錄。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-29-backup"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">備份與換機</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">在設定中保存教材與學習紀錄</text><g clip-path="url(#content-29-backup)"><rect x="24" y="136" width="364" height="193" rx="16" fill="#FFFFFF"/><circle cx="43" cy="169" r="10" fill="none" stroke="#397FC9" stroke-width="2"/><circle cx="43" cy="169" r="5" fill="#397FC9"/><text x="64" y="174" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">完整備份</text><text x="64" y="196" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">教材文字、來源、進度、場次與設定</text><circle cx="43" cy="253" r="10" fill="none" stroke="#5C6E84" stroke-width="2"/><text x="64" y="258" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">僅學習紀錄</text><text x="64" y="280" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">不含教材文字；不能獨立離線換機</text><rect x="24" y="355" width="364" height="102" rx="14" fill="#E8F3FF"/><text x="40" y="382" font-size="14" fill="#2867A7" font-weight="600" text-anchor="start">標準 ZIP 格式，不加密</text><text x="40" y="404" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">請存放在你信任的位置。</text><text x="40" y="424" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">不包含 API 金鑰、Google 授權或語音包。</text><rect x="24" y="488" width="364" height="48" rx="24" fill="#2867A7"/><g transform="translate(42 501) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></g><text x="216.0" y="518" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">匯出 ZIP</text><rect x="24" y="552" width="364" height="48" rx="24" fill="#FFFFFF" stroke="#E0E7F0"/><g transform="translate(42 565) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 2h9v12H3Z"/></g><text x="216.0" y="582" font-size="15" fill="#2867A7" font-weight="600" text-anchor="middle">選擇 ZIP 並預覽還原</text><text x="24" y="653" font-size="18" fill="#172A43" font-weight="700" text-anchor="start">換機後仍需完成</text><text x="24" y="684" font-size="13" fill="#5C6E84" font-weight="400" text-anchor="start">重新安裝所需離線語音包。</text><text x="24" y="709" font-size="13" fill="#5C6E84" font-weight="400" text-anchor="start">重新選取本機檔案並連接 Google / AI。</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h4v8H4ZM16 12h4v8h-4Z"/></g><text x="154" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">播放器</text><g transform="translate(246 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17H5ZM8 8h8M8 12h8M8 16h5"/></g><text x="257" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">教材庫</text><rect x="333" y="807" width="54" height="30" rx="16" fill="#E8F3FF"/><g transform="translate(349 811) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3 3 1 1 6-3 2-1 3H9l-1-3-3-1-1-6 3-2ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></g><text x="360" y="859" font-size="12" fill="#2867A7" font-weight="600" text-anchor="middle">設定</text><rect x="148" y="882" width="116" height="4" rx="2" fill="#172A43"/></g></svg>