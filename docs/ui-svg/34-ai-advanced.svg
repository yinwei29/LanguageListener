<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">進階 API 設定</title><desc id="desc">AI API 與模型  ›  進階。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-34-ai-advanced"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">進階 API 設定</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">AI API 與模型  ›  進階</text><g clip-path="url(#content-34-ai-advanced)"><text x="24" y="148" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">API 格式</text><rect x="24" y="159" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="185" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">自動 / Responses / Chat          ▾</text><text x="24" y="224" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">輸出格式</text><rect x="24" y="235" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="261" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">JSON Schema                     ▾</text><text x="24" y="300" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">相容 API base URL</text><rect x="24" y="311" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="337" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">https://api.example.com/v1</text><rect x="24" y="381" width="364" height="102" rx="14" fill="#E8F3FF"/><text x="40" y="408" font-size="14" fill="#2867A7" font-weight="600" text-anchor="start">網址只在相容供應商時可編輯</text><text x="40" y="430" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">請填 HTTPS base URL，不包含 API 金鑰。</text><text x="40" y="450" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">不同供應商 / 網址不共用已存金鑰。</text><rect x="24" y="526" width="364" height="48" rx="24" fill="#2867A7"/><text x="206.0" y="556" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">儲存進階設定</text><rect x="24" y="590" width="364" height="48" rx="24" fill="#FFFFFF" stroke="#E0E7F0"/><text x="206.0" y="620" font-size="15" fill="#2867A7" font-weight="600" text-anchor="middle">移除此供應商的金鑰</text><text x="24" y="688" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">設定變更後，請重新載入模型或驗證生成。</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h4v8H4ZM16 12h4v8h-4Z"/></g><text x="154" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">播放器</text><g transform="translate(246 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17H5ZM8 8h8M8 12h8M8 16h5"/></g><text x="257" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">教材庫</text>