<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">預覽備份內容</title><desc id="desc">先檢查版本、完整性與內容，再還原。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-30-restore-preview"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">預覽備份內容</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">先檢查版本、完整性與內容，再還原</text><g clip-path="url(#content-30-restore-preview)"><rect x="24" y="136" width="144" height="28" rx="14" fill="#E5F5EE"/><text x="96.0" y="155" font-size="12" fill="#237C66" font-weight="500" text-anchor="middle">備份檢查通過</text><rect x="24" y="184" width="364" height="158" rx="16" fill="#FFFFFF"/><text x="40" y="220" font-size="14" fill="#172A43" font-weight="400" text-anchor="start">建立日期      2026 / 11 / 22</text><text x="40" y="250" font-size="14" fill="#172A43" font-weight="400" text-anchor="start">內容          完整教材與學習紀錄</text><text x="40" y="280" font-size="14" fill="#172A43" font-weight="400" text-anchor="start">來源 / 教材   3 個 / 240 筆</text><text x="40" y="310" font-size="14" fill="#172A43" font-weight="400" text-anchor="start">學習進度      68 筆已學會</text><text x="24" y="384" font-size="18" fill="#172A43" font-weight="700" text-anchor="start">選擇還原方式</text><rect x="24" y="407" width="364" height="168" rx="16" fill="#FFFFFF"/><circle cx="43" cy="442" r="10" fill="none" stroke="#397FC9" stroke-width="2"/><circle cx="43" cy="442" r="5" fill="#397FC9"/><text x="64" y="447" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">智慧合併</text><text x="64" y="469" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">依穩定 ID 合併，保留較新的本機進度</text><circle cx="43" cy="522" r="10" fill="none" stroke="#5C6E84" stroke-width="2"/><text x="64" y="527" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">完整覆蓋</text><text x="64" y="549" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">取代目前資料；下一步將再次確認</text><rect x="24" y="598" width="364" height="80" rx="14" fill="#E8F3FF"/><text x="40" y="625" font-size="14" fill="#2867A7" font-weight="600" text-anchor="start">這個畫面還沒有修改你的資料</text><text x="40" y="647" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">確認後才還原；檔案存取權不會移轉。</text><rect x="24" y="716" width="364" height="48" rx="24" fill="#2867A7"/><text x="206.0" y="746" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">確認並還原</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h4v8H4ZM16 12h4v8h-4Z"/></g><text x="154" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">播放器</text><g transform="translate(246 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17H5ZM8 8h8M8 12h8M8 16h5"/></g><text x="257" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">教材庫</text><rect x="333" y="807" width="54" height="30" rx="16" fill="#E8F3FF"/><g transform="translate(349 811) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3 3 1 1 6-3 2-1 3H9l-1-3-3-1-1-6 3-2ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></g><text x="360" y="859" font-size="12" fill="#2867A7" font-weight="600" text-anchor="middle">設定</text><rect x="148" y="882" width="116" height="4" rx="2" fill="#172A43"/></g></svg>