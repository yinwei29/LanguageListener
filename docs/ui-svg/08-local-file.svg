<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">連接本機檔案</title><desc id="desc">不需要 Google 授權。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-08-local-file"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">連接本機檔案</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">不需要 Google 授權</text><g clip-path="url(#content-08-local-file)"><text x="24" y="148" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">來源名稱</text><rect x="24" y="159" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="185" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">日文旅行</text><text x="24" y="230" font-size="12" fill="#5C6E84" font-weight="500" text-anchor="start">目的地</text><rect x="24" y="241" width="364" height="41" rx="10" fill="#FFFFFF" stroke="#E0E7F0"/><text x="38" y="267" font-size="15" fill="#172A43" font-weight="400" text-anchor="start">建立新來源                 ▾</text><rect x="24" y="308" width="364" height="48" rx="24" fill="#2867A7"/><g transform="translate(42 321) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 2h9v12H3Z"/></g><text x="216.0" y="338" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">選擇 Excel / CSV</text><rect x="24" y="370" width="364" height="48" rx="24" fill="#E8F3FF"/><g transform="translate(42 383) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g><text x="216.0" y="400" font-size="15" fill="#2867A7" font-weight="600" text-anchor="middle">建立初始 CSV</text><rect x="24" y="450" width="364" height="106" rx="14" fill="#E8F3FF"/><text x="40" y="477" font-size="14" fill="#2867A7" font-weight="600" text-anchor="start">由你選擇檔案與儲存位置</text><text x="40" y="499" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">支援 .xlsx 與 UTF-8 CSV。</text><text x="40" y="519" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">舊版 .xls 請先轉存 .xlsx 或 CSV。</text><text x="24" y="598" font-size="18" fill="#172A43" font-weight="700" text-anchor="start">選取檔案之後</text><text x="24" y="628" font-size="14" fill="#5C6E84" font-weight="400" text-anchor="start">預覽工作表與教材欄位。</text><text x="24" y="656" font-size="14" fill="#5C6E84" font-weight="400" text-anchor="start">確認初始化後才補欄位及缺少的 ID。</text><text x="24" y="684" font-size="14" fill="#5C6E84" font-weight="400" text-anchor="start">既有來源可以接回，學習進度會保留。</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 12h4v8H4ZM16 12h4v8h-4Z"/></g><text x="154" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">播放器</text><rect x="230" y="807" width="54" height="30" rx="16" fill="#E8F3FF"/><g transform="translate(246 811) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v17H5ZM8 8h8M8 12h8M8 16h5"/></g><text x="257" y="859" font-size="12" fill="#2867A7" font-weight="600" text-anchor="middle">教材庫</text><g transform="translate(349 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3 3 1 1 6-3 2-1 3H9l-1-3-3-1-1-6 3-2ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></g><text x="360" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">設定</text><rect x="148" y="882" width="116" height="4" rx="2" fill="#172A43"/></g></svg>