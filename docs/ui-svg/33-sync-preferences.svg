<svg xmlns="http://www.w3.org/2000/svg" width="412" height="892" viewBox="0 0 412 892" role="img" aria-labelledby="title desc"><title id="title">同步與連線偏好</title><desc id="desc">網路中斷不影響本機教材。介面提案，所有數據皆為設計示例。</desc><defs><clipPath id="content-33-sync-preferences"><rect x="0" y="126" width="412" height="664"/></clipPath></defs><g font-family="Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="412" height="892" rx="28" fill="#F6F8FC"/><text x="24" y="25" font-size="13" fill="#172A43" font-weight="600" text-anchor="start">9:41</text><text x="386" y="25" font-size="11" fill="#172A43" font-weight="400" text-anchor="end">▰  89%</text><text x="53" y="77" font-size="24" fill="#172A43" font-weight="700" text-anchor="start">同步與連線偏好</text><g transform="translate(20 57) scale(1.0)" fill="none" stroke="#172A43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></g><text x="24" y="108" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">網路中斷不影響本機教材</text><g clip-path="url(#content-33-sync-preferences)"><rect x="24" y="136" width="364" height="156" rx="16" fill="#FFFFFF"/><text x="36" y="175" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">僅 Wi-Fi 同步</text><text x="36" y="197" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">避免行動網路下載</text><rect x="328" y="156" width="48" height="28" rx="14" fill="#397FC9"/><circle cx="362" cy="170" r="10" fill="#FFFFFF"/><text x="36" y="250" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">啟動時同步</text><text x="36" y="272" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">只處理可自動同步的雲端來源</text><rect x="328" y="231" width="48" height="28" rx="14" fill="#397FC9"/><circle cx="362" cy="245" r="10" fill="#FFFFFF"/><rect x="24" y="322" width="364" height="104" rx="14" fill="#E8F3FF"/><text x="40" y="349" font-size="14" fill="#2867A7" font-weight="600" text-anchor="start">本機讀寫不需要網路</text><text x="40" y="371" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">檔案與 Sheets 的雙向合併需手動預覽。</text><text x="40" y="391" font-size="12" fill="#172A43" font-weight="400" text-anchor="start">網路不符政策時保留既有離線教材。</text><g transform="translate(36 474) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-1-10 6 6 0 0 1 11-1 5 5 0 0 1 0 11Z"/></g><text x="72" y="488" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">Google 授權</text><text x="72" y="509" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">可停用同步；本機教材保留</text><text x="364" y="492" font-size="20" fill="#5C6E84" font-weight="400" text-anchor="end">›</text><path d="M36 525H376" stroke="#E0E7F0"/><g transform="translate(36 551) scale(0.9166666666666666)" fill="none" stroke="#397FC9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v6c0 5-8 9-8 9s-8-4-8-9V6ZM8 12l3 3 5-6"/></g><text x="72" y="565" font-size="15" fill="#172A43" font-weight="500" text-anchor="start">API 金鑰管理</text><text x="72" y="586" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="start">只存在此裝置，不納入 ZIP</text><text x="364" y="569" font-size="20" fill="#5C6E84" font-weight="400" text-anchor="end">›</text><path d="M36 602H376" stroke="#E0E7F0"/><rect x="24" y="664" width="364" height="48" rx="24" fill="#2867A7"/><text x="206.0" y="694" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">儲存同步偏好</text></g><rect x="0" y="800" width="412" height="75" rx="0" fill="#FFFFFF"/><path d="M0 800H412" stroke="#E0E7F0"/><g transform="translate(40 811) scale(0.9166666666666666)" fill="none" stroke="#5C6E84" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8M6 10v10h5v-6h3v6h4V10"/></g><text x="51" y="859" font-size="12" fill="#5C6E84" font-weight="400" text-anchor="middle">首頁</text><g transform="translate(143 811) scale(0.9