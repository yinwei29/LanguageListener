version: 2.1

jobs:
  android:
    docker:
      - image: cimg/android:2025.04
    resource_class: medium
    working_directory: ~/LanguageListener
    environment:
      # This image contains several JDKs and defaults to Java 21; builds use 17.
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - checkout
      - restore_cache:
          keys:
            - android-v1-{{ arch }}-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - android-v1-{{ arch }}-
      - run:
          name: Install project Android SDK packages
          command: |
            "$JAVA_HOME/bin/java" -version
            sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - run:
          name: Test, lint and build debug APK
          no_output_timeout: 15m
          command: bash .circleci/build-android.sh
      - store_test_results:
          path: app/build/test-results
      - store_artifacts:
          path: app/build/reports
          destination: reports
      - store_artifacts:
          path: ci-artifacts/apk/LanguageListener-debug.apk
          destination: LanguageListener-debug.apk
      - save_cache:
          key: android-v1-{{ arch }}-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
            - ~/.m2/repository/org/robolectric

workflows:
  android:
    jobs:
      - android:
          filters:
            branches:
              ignore: /^docs\/.*/
